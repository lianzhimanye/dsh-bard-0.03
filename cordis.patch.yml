# ============================================================================
# dsh-bard —— DSH bundle patch
# ============================================================================
# Mounts the Bard host plugin (character cards, world books, skills, and the
# native DSH agent presets it registers) plus its Web settings page.
#
# The host row is the only entry this bundle needs: preset-scoped behaviour is
# registered by the host plugin itself against the agents that select a Bard
# preset, so no per-preset child row is required.
# ============================================================================

- insert:
    - id: bard
      name: dsh-bard
